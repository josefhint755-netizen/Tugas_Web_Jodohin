
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Profil - Jodohin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Jodohin</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarJodohin">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarJodohin">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                <li class="nav-item"><a class="nav-link active" href="tambah-profil.html">Tambah Profil</a></li>
                <li class="nav-item"><a class="nav-link" href="detail-profil.html">Detail Profil</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <h1 class="fw-bold mb-2">Tambah Profil</h1>
                    <p class="text-secondary mb-4">Isi informasi profil untuk bergabung dengan Jodohin.</p>

                    <div id="notifikasi" class="alert d-none" role="status"></div>

                    <form id="formProfil">
                        <div class="mb-3">
                            <label for="nama" class="form-label">Nama Lengkap</label>
                            <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                        </div>

                        <div class="mb-3">
                            <label for="usia" class="form-label">Usia</label>
                            <input type="number" id="usia" class="form-control" min="18" max="100" placeholder="Minimal 18 tahun" required>
                        </div>

                        <div class="mb-3">
                            <label for="lokasi" class="form-label">Lokasi</label>
                            <input type="text" id="lokasi" class="form-control" placeholder="Contoh: Bandung" required>
                        </div>

                        <div class="mb-3">
                            <label for="hobi" class="form-label">Hobi</label>
                            <textarea id="hobi" class="form-control" rows="3" placeholder="Contoh: Membaca, traveling, olahraga" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="bio" class="form-label">Tentang Saya</label>
                            <textarea id="bio" class="form-control" rows="4" placeholder="Ceritakan sedikit tentang dirimu"></textarea>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-danger">Simpan Profil</button>
                            <a href="index.html" class="btn btn-outline-secondary">Kembali ke Beranda</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-4">
    <p class="mb-0">&copy; 2026 Jodohin. Temukan pasangan yang cocok untukmu.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
