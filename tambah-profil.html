
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jodohin - Buat Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Jodohin ❤️</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarJodohin" aria-controls="navbarJodohin"
                aria-expanded="false" aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarJodohin">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah-profil.html">Buat Profil</a></li>
                    <li class="nav-item"><a class="nav-link" href="detail-profil.html">Profil Saya</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 fw-bold mb-2">Buat Profil Kamu</h1>
                        <p class="text-secondary mb-4">
                            Isi informasi berikut untuk mulai menemukan pasangan yang cocok.
                        </p>

                        <form action="#" method="get">
                            <div class="mb-3">
                                <label for="nama" class="form-label">Nama Lengkap</label>
                                <input type="text" class="form-control" id="nama"
                                    name="nama" placeholder="Masukkan nama lengkap" required>
                            </div>

                            <div class="mb-3">
                                <label for="usia" class="form-label">Usia</label>
                                <input type="number" class="form-control" id="usia"
                                    name="usia" min="18" placeholder="Masukkan usia" required>
                            </div>

                            <div class="mb-3">
                                <label for="lokasi" class="form-label">Lokasi</label>
                                <input type="text" class="form-control" id="lokasi"
                                    name="lokasi" placeholder="Contoh: Bandung" required>
                            </div>

                            <div class="mb-3">
                                <label for="hobi" class="form-label">Hobi dan Minat</label>
                                <textarea class="form-control" id="hobi" name="hobi"
                                    rows="3" placeholder="Contoh: Musik, olahraga, traveling"
                                    required></textarea>
                            </div>

                            <div class="mb-4">
                                <label for="bio" class="form-label">Tentang Saya</label>
                                <textarea class="form-control" id="bio" name="bio"
                                    rows="4" placeholder="Ceritakan sedikit tentang diri kamu"></textarea>
                            </div>

                            <div class="d-grid gap-2 d-sm-flex">
                                <button type="submit" class="btn btn-danger">
                                    Simpan Profil
                                </button>
                                <a href="index.html" class="btn btn-outline-secondary">
                                    Kembali
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-top py-4 mt-4">
        <div class="container text-center text-secondary">
            &copy; 2026 Jodohin. Aplikasi Pencarian Pasangan.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
